name: Web build

# Builds the game for the browser and publishes it to GitHub Pages at /play/,
# alongside the browser prototypes at /prototypes/.
#   1. compiles the pixel sim for the web (single-threaded, Emscripten matching Godot's templates),
#   2. exports the Godot project with the official 4.7.1 web templates ("Web" preset in game/export_presets.cfg),
#   3. uploads the build as an ordinary artifact ("web-build") so it can be downloaded and tested,
#   4. deploys the site to Pages (needs Settings > Pages > Source set to "GitHub Actions").
# It compiles its own web library rather than waiting for build-sim.yml, so every push to main is published
# with the sim code of that same commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  # Godot 4.7's official web templates are built with this Emscripten (godotengine/build-containers,
  # branch 4.7, Dockerfile.web); keep it in step with build-sim.yml.
  EMSCRIPTEN_VERSION: "4.0.20"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons==4.8.1
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/.scons-cache
          key: godot-cpp-web${{ env.EMSCRIPTEN_VERSION }}-release-${{ hashFiles('.gitmodules', 'native/SConstruct') }}-${{ github.sha }}
          restore-keys: godot-cpp-web${{ env.EMSCRIPTEN_VERSION }}-release-${{ hashFiles('.gitmodules', 'native/SConstruct') }}-
      - name: Build the web sim library
        working-directory: native
        run: scons platform=web target=template_release threads=no -j4

      - name: Cache Godot and its web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-templates
      - name: Download Godot and its web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          # the template bundle holds every platform (about 1.3 GB); keep only the web ones the preset uses
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j -d templates templates.tpz templates/version.txt 'templates/web_dlink_nothreads_*.zip'
          rm templates.tpz
          ls -la ~/godot ~/godot/templates
      - name: Install Godot
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          dir="$HOME/.local/share/godot/export_templates/$(cat ~/godot/templates/version.txt)"
          mkdir -p "$dir" && cp ~/godot/templates/* "$dir/"

      - name: Export the game
        run: |
          godot --headless --path game --import > import.log 2>&1 || true
          tail -5 import.log
          mkdir -p build/web
          godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html" 2>&1 | grep -v "Storing File" | tee export.log
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/libunholy_sim.web.template_release.wasm32.nothreads.wasm
          if grep -q "^ERROR" export.log; then echo "Export reported errors"; exit 1; fi
          ls -la build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error

  site:
    # Runs even when the game export fails, so the prototypes are always republished.
    if: ${{ !cancelled() }}
    needs: game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.game.result == 'success'
        with:
          name: web-build
          path: build/web
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r prototypes _site/prototypes
          if [ -f build/web/index.html ]; then cp -r build/web _site/play; else echo "::warning::No game build; publishing the prototypes only"; fi
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Unholy Assembly</title>
          <style>
            :root { color-scheme: dark; }
            body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b090c; color: #d8cfc4;
                   font: 17px/1.5 Georgia, "Times New Roman", serif; padding: 0 16px; }
            main { max-width: 34rem; }
            h1 { font-weight: normal; letter-spacing: .04em; color: #e8dccb; margin-bottom: .2rem; }
            p.tag { margin-top: 0; color: #8f8173; font-style: italic; }
            a { color: #c2463e; }
            a.play { display: inline-block; margin: 1rem 0; padding: .6rem 1.4rem; border: 1px solid #c2463e; text-decoration: none; }
            li { margin: .3rem 0; }
            small { color: #8f8173; }
          </style>
          </head>
          <body>
          <main>
            <h1>Unholy Assembly</h1>
            <p class="tag">Bringing Eternal Life to a Village Near You, Since 1197.</p>
            <a class="play" href="play/">Play in your browser</a>
            <p><small>Desktop browser with keyboard and mouse or a gamepad. The first load downloads up to 50&nbsp;MB.</small></p>
            <p>Prototypes:</p>
            <ul>
              <li><a href="prototypes/proving-ground.html">Proving Ground</a>: the spell range</li>
              <li><a href="prototypes/charnel-pit.html">Charnel Pit</a>: the physics sandbox</li>
            </ul>
          </main>
          </body>
          </html>
          EOF
          find _site -maxdepth 2 | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    # Publishing needs the repository's Pages source set to "GitHub Actions" (Settings > Pages).
    if: ${{ !cancelled() && needs.site.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
