name: Build pixel sim

# Compiles the C++ falling-sand extension (native/) for Windows, Linux, macOS and the web
# and commits the libraries to game/bin/, so the Godot project opens anywhere without a compiler.
# The web library is single-threaded (threads=no) and built with the Emscripten version that
# Godot's own web export templates use (godotengine/build-containers, branch 4.7, Dockerfile.web).

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-sim.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Godot 4.7's official web templates are built with this Emscripten; the web library must match it.
  EMSCRIPTEN_VERSION: "4.0.20"

concurrency:
  group: build-sim
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
          - platform: web
            os: ubuntu-22.04
            extra: threads=no
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons==4.8.1
      - name: Set up Emscripten (web only)
        if: matrix.platform == 'web'
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp/bin
            native/godot-cpp/gen
            native/.scons-cache
          key: godot-cpp-${{ matrix.platform }}${{ matrix.platform == 'web' && env.EMSCRIPTEN_VERSION || '' }}-${{ hashFiles('.gitmodules', 'native/SConstruct') }}-${{ github.sha }}
          restore-keys: godot-cpp-${{ matrix.platform }}${{ matrix.platform == 'web' && env.EMSCRIPTEN_VERSION || '' }}-${{ hashFiles('.gitmodules', 'native/SConstruct') }}-
      - name: Build debug and release
        working-directory: native
        shell: bash
        run: |
          scons platform=${{ matrix.platform }} target=template_debug debug_symbols=no ${{ matrix.extra }} -j4
          scons platform=${{ matrix.platform }} target=template_release ${{ matrix.extra }} -j4
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          # only this platform's libraries: the checkout also holds the old ones for the other platforms,
          # and uploading those let the last artifact copied overwrite the fresh builds
          path: |
            game/bin/libunholy_sim.${{ matrix.platform }}.*
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Copy libraries into game/bin
        run: |
          for d in artifacts/bin-*; do cp -r "$d"/* game/bin/; done
          ls -la game/bin
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f game/bin/libunholy_sim.*
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build pixel sim libraries for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
